<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Investment Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script>
        const API_BASE = "http://localhost:8000/api";

        // Portfolio state
        let portfolioData = null;
        let holdings = [];
        let newsData = {};
        let dataStatus = {};
        let conversationId = localStorage.getItem("conversationId") || "default";

        // Fetch portfolio on load
        async function loadPortfolio() {
            try {
                const [summary, holdingsRes, news, status] = await Promise.all([
                    axios.get(`${API_BASE}/portfolio/summary`),
                    axios.get(`${API_BASE}/portfolio/holdings`),
                    axios.get(`${API_BASE}/news/portfolio?limit=50`),
                    axios.get(`${API_BASE}/portfolio/data-status`)
                ]);

                portfolioData = summary.data;
                holdings = holdingsRes.data;
                newsData = news.data;
                dataStatus = status.data;

                render();
            } catch (error) {
                console.error("Failed to load portfolio:", error);
                document.getElementById("root").innerHTML = `<div class="p-4 text-red-600">Error loading portfolio</div>`;
            }
        }

        // Format currency
        function formatCurrency(value, currency = "USD") {
            if (value === null || value === undefined || !currency) {
                return "Unavailable";
            }
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency,
                minimumFractionDigits: 2
            }).format(value);
        }

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        function freshnessLabel(status) {
            return ({
                fresh: "Fresh",
                stale: "Stale",
                not_synced: "Not synced"
            })[status] || "Unavailable";
        }

        // Render dashboard
        function render() {
            const summaryCurrency = portfolioData.currency;
            const summaryWarning = portfolioData.valuation_status === "mixed_currency"
                ? "Totals are unavailable because holdings or prices use different currencies. Convert currencies before comparing them."
                : portfolioData.valuation_status === "partial"
                    ? `Some holdings have no usable price: ${(portfolioData.unpriced_holdings || []).map(escapeHtml).join(", ")}. Total gain/loss is unavailable.`
                    : "";
            const html = `
                <div class="min-h-screen bg-gray-50">
                    <!-- Header -->
                    <header class="bg-white shadow">
                        <div class="max-w-7xl mx-auto px-6 py-4">
                            <h1 class="text-3xl font-bold text-gray-900">AI Investment Desk</h1>
                        </div>
                    </header>

                    <!-- Main Content -->
                    <main class="max-w-7xl mx-auto px-6 py-8">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <!-- Left Column: Portfolio + Chat -->
                            <div class="lg:col-span-2">
                                <!-- Portfolio Summary Cards -->
                                <div class="grid grid-cols-2 gap-4 mb-8">
                                    <div class="bg-white rounded-lg shadow p-6">
                                        <p class="text-gray-600 text-sm">Total Value</p>
                                        <p class="text-2xl font-bold text-gray-900">${formatCurrency(portfolioData.total_value, summaryCurrency)}</p>
                                        <p class="text-xs text-gray-500 mt-1">${escapeHtml(summaryCurrency || "Currency unavailable")}</p>
                                    </div>
                                    <div class="bg-white rounded-lg shadow p-6">
                                        <p class="text-gray-600 text-sm">Total Gain/Loss</p>
                                        <p class="text-2xl font-bold ${portfolioData.total_gain_loss !== null && portfolioData.total_gain_loss >= 0 ? 'text-green-600' : 'text-red-600'}">
                                            ${portfolioData.total_gain_loss === null ? "Unavailable" : `${formatCurrency(portfolioData.total_gain_loss, summaryCurrency)} (${Number(portfolioData.total_gain_loss_percent).toFixed(2)}%)`}
                                        </p>
                                    </div>
                                    <div class="bg-white rounded-lg shadow p-6">
                                        <p class="text-gray-600 text-sm">Holdings</p>
                                        <p class="text-2xl font-bold text-gray-900">${portfolioData.holdings_count}</p>
                                    </div>
                                    <div class="bg-white rounded-lg shadow p-6">
                                        <p class="text-gray-600 text-sm">Assets</p>
                                        <p class="text-2xl font-bold text-gray-900">${portfolioData.assets_count}</p>
                                    </div>
                                </div>
                                ${summaryWarning ? `<p class="mb-6 rounded bg-amber-50 p-3 text-sm text-amber-900">${summaryWarning}</p>` : ""}

                                <section class="bg-white rounded-lg shadow p-6 mb-8">
                                    <h2 class="text-xl font-bold text-gray-900 mb-4">Data status</h2>
                                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                        ${Object.entries(dataStatus).map(([name, item]) => `
                                            <div class="rounded border p-3">
                                                <p class="text-sm font-semibold text-gray-800">${escapeHtml(name.replaceAll("_", " "))}</p>
                                                <p class="text-sm ${item.status === "stale" || item.status === "not_synced" ? "text-amber-700" : "text-green-700"}">${freshnessLabel(item.status)}</p>
                                                <p class="text-xs text-gray-500">${escapeHtml(item.source || "No source")}</p>
                                                <p class="text-xs text-gray-500">${escapeHtml(item.observed_at || "No observation")}</p>
                                            </div>
                                        `).join("")}
                                    </div>
                                </section>

                                <!-- Holdings Table -->
                                <div class="bg-white rounded-lg shadow overflow-hidden mb-8">
                                    <div class="px-6 py-4 border-b">
                                        <h2 class="text-xl font-bold text-gray-900">Holdings</h2>
                                    </div>
                                    <div class="overflow-x-auto">
                                        <table class="w-full">
                                            <thead class="bg-gray-100">
                                                <tr>
                                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Symbol</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Quantity</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Price</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Value</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Gain/Loss</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">%</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y">
                                                ${holdings.map(h => `
                                                    <tr class="hover:bg-gray-50">
                                                        <td class="px-6 py-4 font-semibold text-gray-900">${escapeHtml(h.asset?.symbol || 'N/A')}</td>
                                                        <td class="px-6 py-4 text-right text-gray-600">${Number(h.quantity).toLocaleString('en-US', { maximumFractionDigits: 8 })}</td>
                                                        <td class="px-6 py-4 text-right text-gray-600">
                                                            ${h.current_price !== null ? formatCurrency(h.current_price, h.price_currency || h.asset?.currency) : 'N/A'}
                                                            <span class="block text-xs text-gray-500">${escapeHtml(h.price_source || "No source")} · ${escapeHtml(h.price_date || "No date")} · ${freshnessLabel(h.price_freshness)}</span>
                                                        </td>
                                                        <td class="px-6 py-4 text-right text-gray-600">${h.current_value !== null ? formatCurrency(h.current_value, h.price_currency || h.asset?.currency) : 'N/A'}</td>
                                                        <td class="px-6 py-4 text-right font-semibold ${h.gain_loss === null ? 'text-gray-500' : h.gain_loss >= 0 ? 'text-green-600' : 'text-red-600'}">
                                                            ${h.gain_loss !== null ? formatCurrency(h.gain_loss, h.asset?.currency) : 'N/A'}
                                                        </td>
                                                        <td class="px-6 py-4 text-right font-semibold ${h.gain_loss_percent === null ? 'text-gray-500' : h.gain_loss_percent >= 0 ? 'text-green-600' : 'text-red-600'}">
                                                            ${h.gain_loss_percent !== null ? Number(h.gain_loss_percent).toFixed(2) : 'N/A'}%
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column: Chat Interface -->
                            <div class="lg:col-span-1">
                                <div class="bg-white rounded-lg shadow h-full flex flex-col">
                                    <div class="px-6 py-4 border-b">
                                        <h2 class="text-xl font-bold text-gray-900">Ask Agents</h2>
                                        <p class="text-sm text-gray-600 mt-1">AI-powered portfolio research</p>
                                    </div>

                                    <!-- Chat Messages -->
                                    <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4" style="max-height: 500px;">
                                        <div class="text-gray-500 text-sm">Chat history will appear here...</div>
                                    </div>

                                    <!-- Chat Input -->
                                    <div class="p-6 border-t">
                                        <div class="flex gap-2">
                                            <input
                                                type="text"
                                                id="chatInput"
                                                placeholder="Ask about your portfolio..."
                                                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                            <button
                                                onclick="sendMessage()"
                                                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold"
                                            >
                                                Send
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;

            document.getElementById("root").innerHTML = html;
        }

        // Send chat message
        async function sendMessage() {
            const input = document.getElementById("chatInput");
            const message = input.value.trim();

            if (!message) return;

            const messagesDiv = document.getElementById("chatMessages");

            // Clear placeholder
            if (messagesDiv.textContent.includes("Chat history")) {
                messagesDiv.innerHTML = "";
            }

            // Add user message
            const userMsg = document.createElement("div");
            userMsg.className = "bg-blue-100 p-3 rounded text-sm text-gray-900 ml-auto max-w-xs";
            userMsg.textContent = message;
            messagesDiv.appendChild(userMsg);

            input.value = "";
            input.focus();
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                // Show loading
                const loadingMsg = document.createElement("div");
                loadingMsg.className = "bg-gray-100 p-3 rounded text-sm text-gray-900 italic";
                loadingMsg.textContent = "Analyzing the available portfolio data...";
                messagesDiv.appendChild(loadingMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                // Call chat endpoint with LLM
                const response = await axios.post(`${API_BASE}/chat/message`, {
                    message: message,
                    conversation_id: conversationId
                });

                loadingMsg.remove();

                const result = response.data;

                if (result.response) {
                    // Show agents used
                    const agentsMsg = document.createElement("div");
                    agentsMsg.className = "bg-purple-100 p-2 rounded text-xs text-gray-700 mb-2 break-words";
                    agentsMsg.innerHTML = `<strong>Agents:</strong> ${(result.agents_used || []).join(", ")}`;
                    messagesDiv.appendChild(agentsMsg);

                    // Show LLM response
                    const botMsg = document.createElement("div");
                    botMsg.className = "bg-green-100 p-4 rounded text-base leading-relaxed text-gray-900 max-w-full whitespace-pre-wrap break-words";
                    botMsg.textContent = result.response;
                    messagesDiv.appendChild(botMsg);

                    // Save conversation ID
                    conversationId = result.conversation_id;
                    localStorage.setItem("conversationId", conversationId);
                } else {
                    const errMsg = document.createElement("div");
                    errMsg.className = "bg-red-100 p-3 rounded text-sm text-red-900";
                    errMsg.textContent = "Error: No response from agents";
                    messagesDiv.appendChild(errMsg);
                }

                messagesDiv.scrollTop = messagesDiv.scrollHeight;

            } catch (error) {
                console.error("Chat error:", error);
                const errMsg = document.createElement("div");
                errMsg.className = "bg-red-100 p-3 rounded text-sm text-red-900";
                errMsg.textContent = "Error: " + (error.response?.data?.detail || error.message);
                messagesDiv.appendChild(errMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        // Load on page load
        loadPortfolio();
    </script>
</body>
</html>
