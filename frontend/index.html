<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Investment Desk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script>
        const API_BASE = "http://localhost:8000/api";

        // Portfolio state
        let portfolioData = null;
        let holdings = [];
        let newsData = {};
        let conversationId = localStorage.getItem("conversationId") || "default";

        // Fetch portfolio on load
        async function loadPortfolio() {
            try {
                const [summary, holdingsRes, news] = await Promise.all([
                    axios.get(`${API_BASE}/portfolio/summary`),
                    axios.get(`${API_BASE}/portfolio/holdings`),
                    axios.get(`${API_BASE}/news/portfolio?limit=50`)
                ]);

                portfolioData = summary.data;
                holdings = holdingsRes.data;
                newsData = news.data;

                render();
            } catch (error) {
                console.error("Failed to load portfolio:", error);
                document.getElementById("root").innerHTML = `<div class="p-4 text-red-600">Error loading portfolio</div>`;
            }
        }

        // Format currency
        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            }).format(value);
        }

        // Render dashboard
        function render() {
            const html = `
                <div class="min-h-screen bg-gray-50">
                    <!-- Header -->
                    <header class="bg-white shadow">
                        <div class="max-w-7xl mx-auto px-6 py-4">
                            <h1 class="text-3xl font-bold text-gray-900">AI Investment Desk</h1>
                        </div>
                    </header>

                    <!-- Main Content -->
                    <main class="max-w-7xl mx-auto px-6 py-8">
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <!-- Left Column: Portfolio + Chat -->
                            <div class="lg:col-span-2">
                                <!-- Portfolio Summary Cards -->
                                <div class="grid grid-cols-2 gap-4 mb-8">
                                    <div class="bg-white rounded-lg shadow p-6">
                                        <p class="text-gray-600 text-sm">Total Value</p>
                                        <p class="text-2xl font-bold text-gray-900">${formatCurrency(portfolioData.total_value)}</p>
                                    </div>
                                    <div class="bg-white rounded-lg shadow p-6">
                                        <p class="text-gray-600 text-sm">Total Gain/Loss</p>
                                        <p class="text-2xl font-bold ${portfolioData.total_gain_loss >= 0 ? 'text-green-600' : 'text-red-600'}">
                                            ${formatCurrency(portfolioData.total_gain_loss)} (${portfolioData.total_gain_loss_percent.toFixed(2)}%)
                                        </p>
                                    </div>
                                    <div class="bg-white rounded-lg shadow p-6">
                                        <p class="text-gray-600 text-sm">Holdings</p>
                                        <p class="text-2xl font-bold text-gray-900">${portfolioData.holdings_count}</p>
                                    </div>
                                    <div class="bg-white rounded-lg shadow p-6">
                                        <p class="text-gray-600 text-sm">Assets</p>
                                        <p class="text-2xl font-bold text-gray-900">${portfolioData.assets_count}</p>
                                    </div>
                                </div>

                                <!-- Holdings Table -->
                                <div class="bg-white rounded-lg shadow overflow-hidden mb-8">
                                    <div class="px-6 py-4 border-b">
                                        <h2 class="text-xl font-bold text-gray-900">Holdings</h2>
                                    </div>
                                    <div class="overflow-x-auto">
                                        <table class="w-full">
                                            <thead class="bg-gray-100">
                                                <tr>
                                                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Symbol</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Quantity</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Price</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Value</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">Gain/Loss</th>
                                                    <th class="px-6 py-3 text-right text-sm font-semibold text-gray-700">%</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y">
                                                ${holdings.map(h => `
                                                    <tr class="hover:bg-gray-50">
                                                        <td class="px-6 py-4 font-semibold text-gray-900">${h.asset?.symbol || 'N/A'}</td>
                                                        <td class="px-6 py-4 text-right text-gray-600">${parseFloat(h.quantity).toFixed(2)}</td>
                                                        <td class="px-6 py-4 text-right text-gray-600">${h.current_price ? formatCurrency(h.current_price) : 'N/A'}</td>
                                                        <td class="px-6 py-4 text-right text-gray-600">${h.current_value ? formatCurrency(h.current_value) : 'N/A'}</td>
                                                        <td class="px-6 py-4 text-right font-semibold ${h.gain_loss >= 0 ? 'text-green-600' : 'text-red-600'}">
                                                            ${h.gain_loss ? formatCurrency(h.gain_loss) : 'N/A'}
                                                        </td>
                                                        <td class="px-6 py-4 text-right font-semibold ${h.gain_loss_percent >= 0 ? 'text-green-600' : 'text-red-600'}">
                                                            ${h.gain_loss_percent ? h.gain_loss_percent.toFixed(2) : 'N/A'}%
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column: Chat Interface -->
                            <div class="lg:col-span-1">
                                <div class="bg-white rounded-lg shadow h-full flex flex-col">
                                    <div class="px-6 py-4 border-b">
                                        <h2 class="text-xl font-bold text-gray-900">Ask Agents</h2>
                                        <p class="text-sm text-gray-600 mt-1">AI powered by Gemini</p>
                                    </div>

                                    <!-- Chat Messages -->
                                    <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4" style="max-height: 500px;">
                                        <div class="text-gray-500 text-sm">Chat history will appear here...</div>
                                    </div>

                                    <!-- Chat Input -->
                                    <div class="p-6 border-t">
                                        <div class="flex gap-2">
                                            <input
                                                type="text"
                                                id="chatInput"
                                                placeholder="Ask about your portfolio..."
                                                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                            <button
                                                onclick="sendMessage()"
                                                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold"
                                            >
                                                Send
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;

            document.getElementById("root").innerHTML = html;
        }

        // Send chat message
        async function sendMessage() {
            const input = document.getElementById("chatInput");
            const message = input.value.trim();

            if (!message) return;

            const messagesDiv = document.getElementById("chatMessages");

            // Clear placeholder
            if (messagesDiv.textContent.includes("Chat history")) {
                messagesDiv.innerHTML = "";
            }

            // Add user message
            const userMsg = document.createElement("div");
            userMsg.className = "bg-blue-100 p-3 rounded text-sm text-gray-900 ml-auto max-w-xs";
            userMsg.textContent = message;
            messagesDiv.appendChild(userMsg);

            input.value = "";
            input.focus();
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                // Show loading
                const loadingMsg = document.createElement("div");
                loadingMsg.className = "bg-gray-100 p-3 rounded text-sm text-gray-900 italic";
                loadingMsg.textContent = "Agents analyzing with Gemini AI...";
                messagesDiv.appendChild(loadingMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                // Call chat endpoint with LLM
                const response = await axios.post(`${API_BASE}/chat/message`, {
                    message: message,
                    conversation_id: conversationId
                });

                loadingMsg.remove();

                const result = response.data;

                if (result.response) {
                    // Show agents used
                    const agentsMsg = document.createElement("div");
                    agentsMsg.className = "bg-purple-100 p-2 rounded text-xs text-gray-600 mb-2";
                    agentsMsg.innerHTML = `<strong>Agents:</strong> ${(result.agents_used || []).join(", ")}`;
                    messagesDiv.appendChild(agentsMsg);

                    // Show LLM response
                    const botMsg = document.createElement("div");
                    botMsg.className = "bg-green-100 p-3 rounded text-sm text-gray-900 max-w-xs whitespace-pre-wrap";
                    botMsg.textContent = result.response;
                    messagesDiv.appendChild(botMsg);

                    // Save conversation ID
                    conversationId = result.conversation_id;
                    localStorage.setItem("conversationId", conversationId);
                } else {
                    const errMsg = document.createElement("div");
                    errMsg.className = "bg-red-100 p-3 rounded text-sm text-red-900";
                    errMsg.textContent = "Error: No response from agents";
                    messagesDiv.appendChild(errMsg);
                }

                messagesDiv.scrollTop = messagesDiv.scrollHeight;

            } catch (error) {
                console.error("Chat error:", error);
                const errMsg = document.createElement("div");
                errMsg.className = "bg-red-100 p-3 rounded text-sm text-red-900";
                errMsg.textContent = "Error: " + (error.response?.data?.detail || error.message);
                messagesDiv.appendChild(errMsg);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        // Load on page load
        loadPortfolio();
    </script>
</body>
</html>
